<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden Genius - Contact</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg, #000000, #1a1a1a);
            color:#FFD700;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .contact-container{
            width:100%;
            max-width:700px;
            background:rgba(255,215,0,0.08);
            border:3px solid #FFD700;
            border-radius:20px;
            padding:40px;
            box-shadow:0 0 25px rgba(255,215,0,0.4);
        }

        h1{
            text-align:center;
            font-size:3rem;
            margin-bottom:10px;
            letter-spacing:2px;
        }

        .subtitle{
            text-align:center;
            color:#ffffff;
            margin-bottom:30px;
            font-size:1.1rem;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        input,
        textarea{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:2px solid #FFD700;
            border-radius:8px;
            background:#111;
            color:white;
            font-size:1rem;
        }

        input:focus,
        textarea:focus{
            outline:none;
            border-color:#FFC107;
            box-shadow:0 0 10px #FFD700;
        }

        textarea{
            resize:vertical;
        }

        button{
            width:100%;
            padding:15px;
            background:#FFD700;
            color:#000;
            border:none;
            border-radius:8px;
            font-size:1rem;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#FFC107;
            transform:translateY(-2px);
            box-shadow:0 0 15px #FFD700;
        }

        .contact-info{
            margin-top:30px;
            text-align:center;
            color:#ffffff;
            line-height:1.8;
        }

        footer{
            margin-top:25px;
            text-align:center;
            color:#cccccc;
            font-size:0.9rem;
        }
    </style>
</head>
<body>

<div class="contact-container">

    <h1>Contact Hidden Genius Project</h1>

    <p class="subtitle">
        We'd love to hear from you! Send us a message below.
    </p>

    <form>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Write your message here..."></textarea>

        <button type="submit">Send Message</button>
    </form>

    <div class="contact-info">
        <p><strong>Email:</strong> hiddengenius@example.com</p>
        <p><strong>Phone:</strong> (267) 828-8281</p>
        <p><strong>Location:</strong> Philadelphia, Pennsylvania</p>
        <a href="/Users/admin/Desktop/Cam new website/home.html">Return to Home</a>
    </div>

    <footer>
        &copy; 2026 Hidden Genius. Empowering the next generation of innovators.
    </footer>

</div>

</body>
</html>
